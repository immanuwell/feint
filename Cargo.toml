[workspace]
resolver = "2"
members = ["crates/feint-core", "crates/feint-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic, Postgres-native synthetic test data"
keywords = ["postgres", "postgresql", "database", "seed", "testing"]
categories = ["command-line-utilities", "database"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = { version = "0.7", features = [
    "with-chrono-0_4",
    "with-serde_json-1",
] }
deadpool-postgres = "0.14"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
fake = { version = "3", features = ["chrono", "uuid"] }
rand = "0.8"
rand_chacha = "0.3"
petgraph = "0.6"
blake3 = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["db-tokio-postgres", "serde-str"] }
thiserror = "1"
anyhow = "1"
native-tls = "0.2"
postgres-native-tls = "0.5"
regex = "1"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
rstest = "0.23"
assert_cmd = "2"
dtor = "1"
bincode = "1"
flate2 = "1"
