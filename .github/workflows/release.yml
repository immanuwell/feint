name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-13
            allow-failure: true
          - target: aarch64-apple-darwin
            os: macos-14
            allow-failure: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}
    # macOS runners have been queuing for hours instead of failing fast when
    # a runner image is under capacity or being deprecated (this is what
    # actually happened to the 0.1.0 release: x86_64-apple-darwin queued on
    # macos-13 for 2.5 hours, then got cancelled, which cancelled the whole
    # release). continue-on-error lets a stuck or failed macOS leg drop out
    # without blocking `release`'s `needs: build`; the other platforms still
    # ship even if one macOS target doesn't.
    continue-on-error: ${{ matrix.allow-failure == true }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release -p feint-cli --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="feint-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/feint "$name/"
          cp README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          name="feint-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/feint.exe "$name/"
          cp README.md LICENSE "$name/"
          7z a "$name.zip" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: feint-${{ matrix.target }}
          path: |
            feint-*.tar.gz
            feint-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
